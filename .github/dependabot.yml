version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/London
    open-pull-requests-limit: 2
    versioning-strategy: increase
    groups:
      patch-and-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /agent-skills
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/London
    open-pull-requests-limit: 2
    versioning-strategy: increase
    groups:
      patch-and-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
